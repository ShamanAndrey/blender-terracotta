name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match bl_info version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ADDON=$(python3 -c "
          import re
          s = open('terracotta/__init__.py').read()
          m = re.search(r'\"version\":\s*\((\d+),\s*(\d+)\)', s)
          print(f'{m.group(1)}.{m.group(2)}')")
          echo "tag=$TAG addon=$ADDON"
          case "$TAG" in
            "$ADDON"|"$ADDON".*) ;;
            *) echo "::error::tag v$TAG does not match bl_info $ADDON"; exit 1 ;;
          esac

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxrender1 libxxf86vm1 \
            libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-5.2.0
          key: blender-5.2.0-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz" -o blender.tar.xz
          mkdir blender-5.2.0
          tar -xf blender.tar.xz -C blender-5.2.0 --strip-components=1

      - name: Suite must pass before anything ships
        run: blender-5.2.0/blender -b --python tests/test_tripo.py

      - name: Build the zip
        run: python3 tools/build_zip.py

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: terracotta.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" terracotta.zip \
            --title "Terracotta $GITHUB_REF_NAME" \
            --generate-notes
