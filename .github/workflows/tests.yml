name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "5.2.0"
            dir: "Blender5.2"
            required: true
          - blender: "4.5.0"
            dir: "Blender4.5"
            required: false
    # The 4.5 leg is informational: the addon claims 4.0+ but develops on
    # 5.2 -- a failure there should not turn the badge red until triaged.
    continue-on-error: ${{ !matrix.required }}
    name: blender ${{ matrix.blender }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxrender1 libxxf86vm1 \
            libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-${{ matrix.blender }}
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://download.blender.org/release/${{ matrix.dir }}/blender-${{ matrix.blender }}-linux-x64.tar.xz" -o blender.tar.xz
          mkdir "blender-${{ matrix.blender }}"
          tar -xf blender.tar.xz -C "blender-${{ matrix.blender }}" --strip-components=1

      - name: Run the offline suite (no network, no keys)
        run: blender-${{ matrix.blender }}/blender -b --python tests/test_tripo.py
